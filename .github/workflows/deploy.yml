name: Deploy to ECS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USERNAME }}
          key: ${{ secrets.ECS_SSH_KEY }}
          script: |
            set -e
            cd /opt/vocabulario-espanol
            git pull origin main

            # 安装依赖
            cd client && npm ci && cd ..
            cd server && npm ci && cd ..

            # 构建前后端
            cd client && npm run build && cd ..
            cd server && npm run build && cd ..

            # 写入环境变量
            printf '%s' "${{ secrets.ENV_FILE_CONTENT }}" > server/.env

            # 用 PM2 启动/重启后端（后端会同时托管前端静态文件）
            cd server
            pm2 delete vocabulario-server 2>/dev/null || true
            pm2 start dist/index.js --name vocabulario-server
            pm2 save
