name: Deploy to ECS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 在 GitHub Runner 上构建（Runner 能访问 GitHub/npm，ECS 不能）
      - name: Build client & server
        run: |
          cd client && npm ci && npm run build && cd ..
          cd server && npm ci && npm run build && cd ..

      # 把代码 + 构建产物 + node_modules 推到 ECS（ECS 不访问 GitHub）
      - name: Sync files to ECS via rsync
        env:
          SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USERNAME }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/ecs_key
          chmod 600 ~/.ssh/ecs_key
          ssh-keyscan -H "$ECS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          rsync -az --delete \
            --exclude='.git' \
            --exclude='client/node_modules' \
            --exclude='server/.env' \
            --exclude='*.log' \
            -e "ssh -i ~/.ssh/ecs_key -o StrictHostKeyChecking=no" \
            ./ "$ECS_USER@$ECS_HOST:/opt/vocabulario-espanol/"

      - name: Configure & start on ECS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USERNAME }}
          key: ${{ secrets.ECS_SSH_KEY }}
          script: |
            set -e
            cd /opt/vocabulario-espanol
            # 注入生产环境变量（来自仓库 Secret ENV_FILE_CONTENT）
            printf '%s' "${{ secrets.ENV_FILE_CONTENT }}" > server/.env

            cd server
            pm2 delete vocabulario-server 2>/dev/null || true
            pm2 start dist/index.js --name vocabulario-server
            pm2 save
