name: Deploy to ECS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 在 GitHub Runner 上只构建 client（纯前端产物跨平台可用）
      # server 不在这里构建：better-sqlite3 是原生模块，Runner 的 glibc 版本
      # 比服务器高，编译后的二进制在服务器上会报 GLIBC_2.38 not found
      - name: Build client
        run: |
          cd client && npm ci && npm run build && cd ..

      # 调试：确认网络可达性
      - name: Debug SSH connectivity
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USERNAME }}
        run: |
          echo "ECS_HOST=$ECS_HOST"
          echo "ECS_USER=$ECS_USER"
          echo "Testing TCP port 22..."
          timeout 10 bash -c "until nc -z -v $ECS_HOST 22; do sleep 1; done" || echo "Port 22 not reachable"

      # 准备 SSH 密钥：从 Base64 Secret 解码（单行文本，避免换行丢失问题）
      - name: Prepare SSH key
        env:
          SSH_KEY_B64: ${{ secrets.ECS_SSH_KEY_B64 }}
          ECS_HOST: ${{ secrets.ECS_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY_B64" | base64 -d > ~/.ssh/ecs_key
          chmod 600 ~/.ssh/ecs_key
          ssh-keyscan -H "$ECS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      # 把代码推到 ECS（server 的依赖和构建产物在服务器本地重新安装/编译）
      - name: Sync files to ECS via rsync
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USERNAME }}
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='client/node_modules' \
            --exclude='server/node_modules' \
            --exclude='server/dist' \
            --exclude='server/.env' \
            --exclude='server/uploads' \
            --exclude='server/data' \
            --exclude='*.log' \
            -e "ssh -i ~/.ssh/ecs_key -o StrictHostKeyChecking=no" \
            ./ "$ECS_USER@$ECS_HOST:/opt/vocabulario-espanol/"

      - name: Copy .env to ECS
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USERNAME }}
        run: |
          printf '%s' "${{ secrets.ENV_FILE_CONTENT }}" > /tmp/server.env
          scp -i ~/.ssh/ecs_key -o StrictHostKeyChecking=no \
            /tmp/server.env "$ECS_USER@$ECS_HOST:/opt/vocabulario-espanol/server/.env"
          rm -f /tmp/server.env

      - name: Build & start services on ECS
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USERNAME }}
        run: |
          ssh -i ~/.ssh/ecs_key -o StrictHostKeyChecking=no "$ECS_USER@$ECS_HOST" << 'EOF'
            set -e
            cd /opt/vocabulario-espanol/server
            npm ci --no-audit --no-fund
            npm run build
            pm2 delete vocabulario-server 2>/dev/null || true
            pm2 start dist/index.js --name vocabulario-server
            pm2 save
          EOF
